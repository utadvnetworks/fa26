services:
  jekyll:
    image: ruby:3.2
    working_dir: /site
    command: bash -c "bundle install && bundle exec jekyll serve --host 0.0.0.0 --port 4000 --force_polling --baseurl ''"
    ports:
      - "4000:4000"
    volumes:
      - .:/site
      - bundle_cache:/usr/local/bundle

volumes:
  bundle_cache:
